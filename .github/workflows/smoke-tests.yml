name: Smoke tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  linux:
    name: Linux (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install system Tk + Xvfb
        run: sudo apt-get update && sudo apt-get install -y python3-tk xvfb

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Verify the source-mode launcher
        run: xvfb-run -a python civitai_tracker.py --version

      - name: Run smoke tests
        run: xvfb-run -a python tests/smoke_tests.py
